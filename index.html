<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活记账</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
    --bg: #0C1220;
    --bg2: #111827;
    --card: #141E30;
    --cardh: #1A2740;
    --bdr: #1E3050;
    --fg: #E8ECF1;
    --mt: #6B7A90;
    --ac: #00E5A0;
    --acd: rgba(0,229,160,.12);
    --inc: #00E5A0;
    --exp: #FF5C5C;
    --wrn: #FFB830;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 3px; }

/* 背景光晕 */
.glow {
    position: fixed; border-radius: 50%; filter: blur(130px);
    pointer-events: none; z-index: 0;
}
.g1 {
    width: 420px; height: 420px; background: var(--ac);
    top: -120px; right: -100px; opacity: .1;
    animation: gp 10s ease-in-out infinite;
}
.g2 {
    width: 320px; height: 320px; background: var(--exp);
    bottom: -80px; left: -60px; opacity: .07;
    animation: gp 12s ease-in-out infinite 2s;
}
@keyframes gp {
    0%,100% { opacity:.08; transform:scale(1); }
    50% { opacity:.16; transform:scale(1.08); }
}

/* 主容器 */
.wrap {
    max-width: 520px; margin: 0 auto; padding: 0 16px;
    position: relative; z-index: 1;
}
@media(min-width:960px) {
    .wrap { max-width: 920px; }
    .d2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .fw { grid-column: 1 / -1; }
}

/* 卡片 */
.card {
    background: var(--card); border: 1px solid var(--bdr);
    border-radius: 16px; transition: border-color .3s;
}
.card:hover { border-color: rgba(0,229,160,.18); }

/* 概览卡片 */
.ov {
    padding: 16px; border-radius: 14px; background: var(--card);
    border: 1px solid var(--bdr); position: relative; overflow: hidden;
}
.ov::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 100%; height: 3px;
}
.ov.ic::before { background: var(--inc); }
.ov.ec::before { background: var(--exp); }
.ov.bc::before { background: var(--wrn); }

/* Tab 按钮 */
.tb {
    padding: 9px 20px; border-radius: 10px; font-weight: 500;
    transition: all .3s; cursor: pointer; color: var(--mt);
    background: none; border: none; font-size: 13px; font-family: inherit;
}
.tb.on { background: var(--acd); color: var(--ac); }
.tb:hover:not(.on) { color: var(--fg); }

/* 筛选标签 */
.ft {
    padding: 5px 12px; border-radius: 18px; font-size: 11px;
    border: 1px solid var(--bdr); background: none; color: var(--mt);
    cursor: pointer; transition: all .2s; white-space: nowrap; font-family: inherit;
}
.ft.on { background: var(--acd); border-color: var(--ac); color: var(--ac); }
.ft:hover:not(.on) { border-color: var(--mt); color: var(--fg); }

/* 主按钮 */
.btn1 {
    width: 100%; padding: 13px; border-radius: 14px; border: none;
    background: var(--ac); color: #0C1220; font-weight: 700;
    font-size: 15px; cursor: pointer; transition: all .2s; font-family: inherit;
}
.btn1:hover { opacity: .9; transform: translateY(-1px); }
.btn1:active { transform: translateY(0); }

/* 月份按钮 */
.mnbtn {
    width: 34px; height: 34px; border-radius: 10px;
    border: 1px solid var(--bdr); background: var(--card);
    color: var(--fg); cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: all .2s; font-size: 12px;
}
.mnbtn:hover { border-color: var(--ac); color: var(--ac); }

/* 输入框 */
.inp {
    width: 100%; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--bdr); background: var(--bg2);
    color: var(--fg); font-size: 13px; outline: none;
    transition: border-color .2s; font-family: inherit;
}
.inp:focus { border-color: var(--ac); }
.inp::placeholder { color: var(--mt); }

/* 金额大输入框 */
.aminp {
    width: 100%; background: none; border: none; color: var(--fg);
    font-size: 32px; font-weight: 700; outline: none;
    text-align: center; font-family: inherit;
}
.aminp::placeholder { color: var(--bdr); }

/* 类型切换 */
.tsw { display: flex; background: var(--bg2); border-radius: 12px; padding: 3px; gap: 3px; }
.tswb {
    flex: 1; padding: 9px; border-radius: 10px; border: none;
    cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all .3s; font-family: inherit; background: none; color: var(--mt);
}
.tswb.ea { background: rgba(255,92,92,.12); color: var(--exp); }
.tswb.ia { background: rgba(0,229,160,.12); color: var(--inc); }

/* 分类选择项 */
.cati {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 2px; border-radius: 10px; cursor: pointer;
    transition: all .2s; border: 2px solid transparent; background: none;
}
.cati:hover { background: var(--cardh); }
.cati.sel { border-color: var(--ac); background: var(--acd); }
.cati span { font-size: 10px; color: var(--mt); margin-top: 3px; }
.cati.sel span { color: var(--ac); }
.catic {
    width: 34px; height: 34px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
}

/* 账户选择项 */
.acci {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 9px; cursor: pointer;
    transition: all .2s; border: 1px solid var(--bdr);
    background: none; color: var(--mt); font-size: 11px; font-family: inherit;
}
.acci.sel { border-color: var(--ac); background: var(--acd); color: var(--ac); }
.acci:hover:not(.sel) { border-color: var(--mt); }

/* 账单条目 */
.bil {
    display: flex; align-items: center; padding: 11px 12px;
    border-radius: 11px; transition: all .15s; cursor: pointer; gap: 10px;
}
.bil:hover { background: var(--cardh); }
.bico {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
}

/* 模态框 */
.mo {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    backdrop-filter: blur(4px); z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
}
.mo.on { opacity: 1; pointer-events: all; }
.moc {
    background: var(--card); border: 1px solid var(--bdr);
    border-radius: 20px 20px 0 0; width: 100%; max-width: 500px;
    max-height: 88vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform .4s cubic-bezier(.16,1,.3,1); padding: 20px;
}
.mo.on .moc { transform: translateY(0); }
@media(min-width:640px) {
    .mo { align-items: center; }
    .moc {
        border-radius: 20px; max-height: 82vh;
        transform: translateY(30px) scale(.96);
    }
    .mo.on .moc { transform: translateY(0) scale(1); }
}

/* 预算进度条 */
.bubar { height: 5px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
.bubar-f { height: 100%; border-radius: 3px; transition: width .5s ease; }

/* 排行进度条 */
.rkbar { height: 20px; background: var(--bg2); border-radius: 5px; overflow: hidden; }
.rkbar-f {
    height: 100%; border-radius: 5px; transition: width .5s;
    display: flex; align-items: center; padding-left: 7px;
    font-size: 10px; font-weight: 600; color: var(--bg);
    min-width: fit-content;
}

/* Toast */
.tst {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 10px 20px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--bdr);
    color: var(--fg); font-size: 13px; z-index: 200;
    transition: transform .4s cubic-bezier(.16,1,.3,1);
    display: flex; align-items: center; gap: 7px;
}
.tst.show { transform: translateX(-50%) translateY(0); }

/* FAB */
.fab {
    position: fixed; bottom: 24px; right: 24px;
    width: 52px; height: 52px; border-radius: 15px;
    background: var(--ac); color: #0C1220; border: none;
    font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,229,160,.3);
    transition: all .3s; z-index: 50;
    display: flex; align-items: center; justify-content: center;
}
.fab:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 6px 28px rgba(0,229,160,.4);
}

/* 图表容器 */
.chbox { position: relative; height: 240px; padding: 6px; }
@media(min-width:960px) { .chbox { height: 280px; } }

/* 空状态 */
.empt { text-align: center; padding: 50px 20px; color: var(--mt); }
.empt i { font-size: 42px; margin-bottom: 12px; opacity: .2; display: block; }

/* 右键菜单 */
.ctx {
    position: fixed; background: var(--card); border: 1px solid var(--bdr);
    border-radius: 10px; padding: 4px; min-width: 110px; z-index: 150;
    display: none; box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.ctx.show { display: block; }
.ctx button {
    display: flex; align-items: center; gap: 7px; width: 100%;
    padding: 7px 11px; border: none; background: none; color: var(--fg);
    font-size: 12px; cursor: pointer; border-radius: 6px;
    font-family: inherit; transition: background .15s;
}
.ctx button:hover { background: var(--cardh); }
.ctx button.dg { color: var(--exp); }

/* 日期分组头 */
.dgh {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 2px; font-size: 11px; color: var(--mt);
}

/* 分类筛选滚动容器 */
.cscr {
    display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
}
.cscr::-webkit-scrollbar { display: none; }

/* 搜索框 */
.sw { position: relative; }
.sw > i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--mt); font-size: 12px; }
.sw input { padding-left: 32px; }
</style>
</head>
<body>

<!-- 背景光晕 -->
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="wrap" style="padding-top:20px;padding-bottom:90px">

    <!-- 顶部 -->
    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <div>
            <h1 style="font-size:21px;font-weight:900;letter-spacing:-.5px">生活记账</h1>
            <p style="font-size:11px;color:var(--mt);margin-top:1px">记录每一笔，生活更清晰</p>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
            <button class="mnbtn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="monthDisp" style="font-size:13px;font-weight:600;min-width:86px;text-align:center;cursor:pointer" onclick="goToday()" title="回到本月"></span>
            <button class="mnbtn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </header>

    <!-- 概览三卡片 -->
    <section style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        <div class="ov ic">
            <div style="font-size:10px;color:var(--mt);margin-bottom:4px">
                <i class="fa-solid fa-arrow-down" style="color:var(--inc);margin-right:3px"></i>收入
            </div>
            <div id="totInc" style="font-size:16px;font-weight:700;color:var(--inc)">0.00</div>
        </div>
        <div class="ov ec">
            <div style="font-size:10px;color:var(--mt);margin-bottom:4px">
                <i class="fa-solid fa-arrow-up" style="color:var(--exp);margin-right:3px"></i>支出
            </div>
            <div id="totExp" style="font-size:16px;font-weight:700;color:var(--exp)">0.00</div>
        </div>
        <div class="ov bc">
            <div style="font-size:10px;color:var(--mt);margin-bottom:4px">
                <i class="fa-solid fa-wallet" style="color:var(--wrn);margin-right:3px"></i>结余
            </div>
            <div id="totBal" style="font-size:16px;font-weight:700;color:var(--wrn)">0.00</div>
        </div>
    </section>

    <!-- 月预算 -->
    <section class="card" style="padding:14px;margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:12px;color:var(--mt)">
                <i class="fa-solid fa-bullseye" style="margin-right:4px"></i>月预算
            </span>
            <div style="display:flex;align-items:center;gap:4px">
                <span style="font-size:11px;color:var(--mt)">¥</span>
                <input type="number" id="budgetInp" class="inp" style="width:90px;padding:5px 8px;font-size:12px;text-align:right" placeholder="设置预算" onchange="saveBudget()">
            </div>
        </div>
        <div class="bubar">
            <div id="budgetBar" class="bubar-f" style="width:0%;background:var(--ac)"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:5px">
            <span id="budgetSpent" style="font-size:10px;color:var(--mt)">已花 ¥0</span>
            <span id="budgetRemain" style="font-size:10px;color:var(--mt)">剩余 ¥0</span>
        </div>
    </section>

    <!-- Tab 导航 -->
    <nav style="display:flex;gap:3px;margin-bottom:16px;background:var(--bg2);border-radius:11px;padding:3px">
        <button class="tb on" data-tab="list" onclick="switchTab('list')">
            <i class="fa-solid fa-list" style="margin-right:5px"></i>明细
        </button>
        <button class="tb" data-tab="stats" onclick="switchTab('stats')">
            <i class="fa-solid fa-chart-pie" style="margin-right:5px"></i>统计
        </button>
    </nav>

    <!-- 明细页 -->
    <section id="listPage">
        <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
            <button class="ft on" data-ft="all" onclick="setFilter('all')">全部</button>
            <button class="ft" data-ft="expense" onclick="setFilter('expense')">支出</button>
            <button class="ft" data-ft="income" onclick="setFilter('income')">收入</button>
            <div class="sw" style="flex:1;min-width:130px">
                <i class="fa-solid fa-search"></i>
                <input class="inp" id="searchInput" style="font-size:12px;padding:7px 10px 7px 30px" placeholder="搜索备注..." oninput="onSearch()">
            </div>
        </div>
        <div id="catFilter" class="cscr" style="margin-bottom:12px"></div>
        <div id="billList"></div>
    </section>

    <!-- 统计页 -->
    <section id="statsPage" style="display:none">
        <div class="d2">
            <div class="card fw" style="padding:16px;margin-bottom:14px">
                <h3 style="font-size:14px;font-weight:600;margin-bottom:8px">
                    <i class="fa-solid fa-chart-line" style="color:var(--ac);margin-right:6px"></i>收支趋势
                </h3>
                <div class="chbox"><canvas id="trendChart"></canvas></div>
            </div>
            <div class="card" style="padding:16px;margin-bottom:14px">
                <h3 style="font-size:14px;font-weight:600;margin-bottom:8px">
                    <i class="fa-solid fa-chart-pie" style="color:var(--exp);margin-right:6px"></i>支出分类
                </h3>
                <div class="chbox"><canvas id="expPie"></canvas></div>
            </div>
            <div class="card" style="padding:16px;margin-bottom:14px">
                <h3 style="font-size:14px;font-weight:600;margin-bottom:8px">
                    <i class="fa-solid fa-chart-pie" style="color:var(--inc);margin-right:6px"></i>收入分类
                </h3>
                <div class="chbox"><canvas id="incPie"></canvas></div>
            </div>
            <div class="card fw" style="padding:16px;margin-bottom:14px">
                <h3 style="font-size:14px;font-weight:600;margin-bottom:12px">
                    <i class="fa-solid fa-ranking-star" style="color:var(--wrn);margin-right:6px"></i>支出排行
                </h3>
                <div id="rankList"></div>
            </div>
        </div>
    </section>
</div>

<!-- 添加按钮 -->
<button class="fab" onclick="openAdd()"><i class="fa-solid fa-plus"></i></button>

<!-- 添加/编辑模态框 -->
<div class="mo" id="addModal" onclick="if(event.target===this)closeAdd()">
    <div class="moc">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <h2 id="modalTitle" style="font-size:17px;font-weight:700">记一笔</h2>
            <button style="background:none;border:none;color:var(--mt);font-size:18px;cursor:pointer;padding:4px" onclick="closeAdd()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- 收入/支出切换 -->
        <div class="tsw" style="margin-bottom:16px">
            <button class="tswb ea" id="typeExp" onclick="setAddType('expense')">支出</button>
            <button class="tswb" id="typeInc" onclick="setAddType('income')">收入</button>
        </div>

        <!-- 金额 -->
        <div style="text-align:center;margin-bottom:16px;padding:10px 0;border-bottom:1px solid var(--bdr)">
            <span style="font-size:20px;font-weight:300;color:var(--mt)">¥</span>
            <input type="number" id="amtInput" class="aminp" placeholder="0.00" step="0.01" min="0">
        </div>

        <!-- 分类选择 -->
        <div style="margin-bottom:14px">
            <div style="font-size:12px;color:var(--mt);margin-bottom:8px">分类</div>
            <div id="catGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px"></div>
        </div>

        <!-- 账户选择 -->
        <div style="margin-bottom:14px">
            <div style="font-size:12px;color:var(--mt);margin-bottom:8px">账户</div>
            <div id="accGrid" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        </div>

        <!-- 日期 -->
        <div style="margin-bottom:14px">
            <div style="font-size:12px;color:var(--mt);margin-bottom:6px">日期</div>
            <input type="date" id="dateInput" class="inp">
        </div>

        <!-- 备注 -->
        <div style="margin-bottom:18px">
            <div style="font-size:12px;color:var(--mt);margin-bottom:6px">备注</div>
            <input type="text" id="noteInput" class="inp" placeholder="添加备注..." maxlength="50">
        </div>

        <button class="btn1" onclick="saveBill()">保存</button>
    </div>
</div>

<!-- 右键操作菜单 -->
<div class="ctx" id="ctxMenu">
    <button onclick="editBill()"><i class="fa-solid fa-pen"></i> 编辑</button>
    <button class="dg" onclick="deleteBill()"><i class="fa-solid fa-trash"></i> 删除</button>
</div>

<!-- Toast 提示 -->
<div class="tst" id="toast">
    <i class="fa-solid fa-check-circle" style="color:var(--ac)"></i>
    <span id="toastMsg"></span>
</div>

<script>
/* ===== 分类数据 ===== */
var CATS = {
    expense: [
        { id:'food', name:'餐饮', icon:'fa-utensils', color:'#FF6B6B' },
        { id:'transport', name:'交通', icon:'fa-bus', color:'#4ECDC4' },
        { id:'shopping', name:'购物', icon:'fa-bag-shopping', color:'#FFD93D' },
        { id:'housing', name:'住房', icon:'fa-house', color:'#A78BFA' },
        { id:'fun', name:'娱乐', icon:'fa-gamepad', color:'#F472B6' },
        { id:'medical', name:'医疗', icon:'fa-hospital', color:'#34D399' },
        { id:'edu', name:'教育', icon:'fa-graduation-cap', color:'#60A5FA' },
        { id:'telecom', name:'通讯', icon:'fa-mobile-screen', color:'#FB923C' },
        { id:'clothing', name:'服饰', icon:'fa-shirt', color:'#E879F9' },
        { id:'pets', name:'宠物', icon:'fa-paw', color:'#FCA5A5' },
        { id:'social', name:'社交', icon:'fa-champagne-glasses', color:'#FBBF24' },
        { id:'other_e', name:'其他', icon:'fa-ellipsis', color:'#94A3B8' }
    ],
    income: [
        { id:'salary', name:'工资', icon:'fa-money-bill-wave', color:'#00E5A0' },
        { id:'bonus', name:'奖金', icon:'fa-gift', color:'#FFD93D' },
        { id:'invest', name:'投资', icon:'fa-chart-line', color:'#60A5FA' },
        { id:'parttime', name:'兼职', icon:'fa-briefcase', color:'#F472B6' },
        { id:'redpkt', name:'红包', icon:'fa-envelope', color:'#FF6B6B' },
        { id:'refund', name:'退款', icon:'fa-rotate-left', color:'#4ECDC4' },
        { id:'other_i', name:'其他', icon:'fa-ellipsis', color:'#94A3B8' }
    ]
};

var ACCS = [
    { id:'cash', name:'现金', icon:'fa-money-bill' },
    { id:'wechat', name:'微信', icon:'fa-brands fa-weixin' },
    { id:'alipay', name:'支付宝', icon:'fa-brands fa-alipay' },
    { id:'bank', name:'银行卡', icon:'fa-credit-card' }
];

/* ===== 应用状态 ===== */
var bills = [];
try { bills = JSON.parse(localStorage.getItem('bills') || '[]'); } catch(e) { bills = []; }
var curYear = new Date().getFullYear();
var curMonth = new Date().getMonth();
var filterType = 'all';
var filterCat = 'all';
var searchNote = '';
var addType = 'expense';
var selCat = null;
var selAcc = 'cash';
var editId = null;
var ctxTargetId = null;
var trendInst = null;
var expPieInst = null;
var incPieInst = null;

/* ===== 工具函数 ===== */
function getCat(id) {
    var all = CATS.expense.concat(CATS.income);
    for (var i = 0; i < all.length; i++) {
        if (all[i].id === id) return all[i];
    }
    return { id: id, name: '未知', icon: 'fa-question', color: '#94A3B8' };
}

function getAcc(id) {
    for (var i = 0; i < ACCS.length; i++) {
        if (ACCS[i].id === id) return ACCS[i];
    }
    return { id: id, name: '未知', icon: 'fa-question' };
}

function fmt(v) {
    return v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function pz(n) {
    return String(n).padStart(2, '0');
}

function monthKey(y, m) {
    return y + '-' + pz(m + 1);
}

function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pz(d.getMonth() + 1) + '-' + pz(d.getDate());
}

function persist() {
    try { localStorage.setItem('bills', JSON.stringify(bills)); } catch(e) {}
}

/* ===== 生成示例数据 ===== */
function generateSampleData() {
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth();
    var lastDay = new Date(y, m + 1, 0).getDate();
    var today = Math.min(now.getDate(), lastDay);

    /* 安全日期：确保日不超过当月最大天数 */
    function safeDate(day) {
        return y + '-' + pz(m + 1) + '-' + pz(Math.min(Math.max(1, day), lastDay));
    }

    var samples = [
        { type:'expense', amount:35,    category:'food',      account:'wechat', note:'午餐外卖',  date:safeDate(today) },
        { type:'expense', amount:6,     category:'transport', account:'alipay', note:'地铁',      date:safeDate(today) },
        { type:'expense', amount:299,   category:'shopping',  account:'bank',   note:'日用品采购', date:safeDate(today - 1) },
        { type:'expense', amount:88,    category:'fun',       account:'wechat', note:'电影票',    date:safeDate(today - 1) },
        { type:'income',  amount:12000, category:'salary',    account:'bank',   note:'月薪',      date:safeDate(10) },
        { type:'expense', amount:2800,  category:'housing',   account:'bank',   note:'房租',      date:safeDate(1) },
        { type:'expense', amount:128,   category:'telecom',   account:'alipay', note:'话费充值',  date:safeDate(5) },
        { type:'expense', amount:59,    category:'clothing',  account:'alipay', note:'T恤',      date:safeDate(today - 2) },
        { type:'income',  amount:500,   category:'bonus',     account:'wechat', note:'绩效奖',    date:safeDate(15) },
        { type:'expense', amount:42,    category:'food',      account:'cash',   note:'早餐+咖啡', date:safeDate(today - 3) },
        { type:'expense', amount:200,   category:'medical',   account:'wechat', note:'体检',      date:safeDate(8) },
        { type:'expense', amount:150,   category:'edu',       account:'alipay', note:'网课',      date:safeDate(12) },
        { type:'income',  amount:800,   category:'parttime',  account:'wechat', note:'周末兼职',  date:safeDate(18) },
        { type:'expense', amount:66,    category:'social',    account:'wechat', note:'朋友聚餐',  date:safeDate(today - 2) },
        { type:'expense', amount:120,   category:'pets',      account:'wechat', note:'猫粮',      date:safeDate(20) },
        { type:'income',  amount:200,   category:'redpkt',    account:'wechat', note:'生日红包',  date:safeDate(22) }
    ];

    samples.forEach(function(s, idx) {
        bills.push({
            id: Date.now() + idx * 137 + Math.floor(Math.random() * 1000),
            type: s.type,
            amount: s.amount,
            category: s.category,
            account: s.account,
            note: s.note,
            date: s.date
        });
    });
    persist();
}

if (!bills.length) {
    generateSampleData();
}

/* ===== 月份切换 ===== */
function changeMonth(d) {
    curMonth += d;
    if (curMonth < 0) { curMonth = 11; curYear--; }
    if (curMonth > 11) { curMonth = 0; curYear++; }
    refresh();
}

function goToday() {
    curYear = new Date().getFullYear();
    curMonth = new Date().getMonth();
    refresh();
}

/* ===== 数据筛选 ===== */
function monthBills() {
    var key = monthKey(curYear, curMonth);
    return bills.filter(function(b) { return b.date.substring(0, 7) === key; });
}

function filteredBills() {
    var list = monthBills();
    if (filterType !== 'all') {
        list = list.filter(function(b) { return b.type === filterType; });
    }
    if (filterCat !== 'all') {
        list = list.filter(function(b) { return b.category === filterCat; });
    }
    if (searchNote.trim()) {
        var q = searchNote.trim();
        list = list.filter(function(b) { return (b.note || '').indexOf(q) !== -1; });
    }
    return list.sort(function(a, b) {
        if (b.date !== a.date) return b.date.localeCompare(a.date);
        return b.id - a.id;
    });
}

/* ===== 概览更新 ===== */
function updateOverview() {
    var mb = monthBills();
    var inc = 0, exp = 0;
    for (var i = 0; i < mb.length; i++) {
        if (mb[i].type === 'income') inc += mb[i].amount;
        else exp += mb[i].amount;
    }
    document.getElementById('totInc').textContent = fmt(inc);
    document.getElementById('totExp').textContent = fmt(exp);
    document.getElementById('totBal').textContent = fmt(inc - exp);

    /* 预算 */
    var bKey = 'budget_' + monthKey(curYear, curMonth);
    var budget = parseFloat(localStorage.getItem(bKey) || '0');
    document.getElementById('budgetInp').value = budget || '';
    var pct = budget > 0 ? Math.min(exp / budget * 100, 100) : 0;
    var bar = document.getElementById('budgetBar');
    bar.style.width = pct + '%';
    bar.style.background = pct > 90 ? 'var(--exp)' : pct > 60 ? 'var(--wrn)' : 'var(--ac)';
    document.getElementById('budgetSpent').textContent = '已花 ¥' + fmt(exp);
    document.getElementById('budgetRemain').textContent = budget > 0 ? '剩余 ¥' + fmt(Math.max(0, budget - exp)) : '未设预算';

    /* 月份文字 */
    document.getElementById('monthDisp').textContent = curYear + '年' + (curMonth + 1) + '月';
}

function saveBudget() {
    var v = parseFloat(document.getElementById('budgetInp').value) || 0;
    localStorage.setItem('budget_' + monthKey(curYear, curMonth), String(v));
    updateOverview();
}

/* ===== 分类筛选标签 ===== */
function renderCatFilter() {
    var cats = filterType === 'all' ? CATS.expense.concat(CATS.income) : CATS[filterType];
    var h = '<button class="ft ' + (filterCat === 'all' ? 'on' : '') + '" onclick="setCatFilter(\'all\')">全部</button>';
    for (var i = 0; i < cats.length; i++) {
        var c = cats[i];
        h += '<button class="ft ' + (filterCat === c.id ? 'on' : '') + '" onclick="setCatFilter(\'' + c.id + '\')">' + c.name + '</button>';
    }
    document.getElementById('catFilter').innerHTML = h;
}

function setCatFilter(id) {
    filterCat = id;
    renderCatFilter();
    renderList();
}

/* ===== 账单列表 ===== */
function renderList() {
    var list = filteredBills();
    var el = document.getElementById('billList');

    if (!list.length) {
        el.innerHTML = '<div class="empt"><i class="fa-solid fa-receipt"></i><p>暂无账单记录</p><p style="font-size:11px;margin-top:4px">点击右下角按钮开始记账</p></div>';
        return;
    }

    /* 按日期分组 */
    var groups = {};
    for (var i = 0; i < list.length; i++) {
        var b = list[i];
        if (!groups[b.date]) groups[b.date] = [];
        groups[b.date].push(b);
    }

    var wk = ['日','一','二','三','四','五','六'];
    var html = '';
    var dates = Object.keys(groups).sort(function(a, b) { return b.localeCompare(a); });

    for (var d = 0; d < dates.length; d++) {
        var date = dates[d];
        var parts = date.split('-');
        var dayInc = 0, dayExp = 0;
        for (var j = 0; j < groups[date].length; j++) {
            if (groups[date][j].type === 'income') dayInc += groups[date][j].amount;
            else dayExp += groups[date][j].amount;
        }

        var dateObj = new Date(date + 'T00:00:00');
        var dateLabel = parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日 周' + wk[dateObj.getDay()];

        html += '<div class="dgh" style="margin-top:10px"><span>' + dateLabel + '</span><span>';
        if (dayInc > 0) html += '<span style="color:var(--inc)">+' + fmt(dayInc) + '</span> ';
        if (dayExp > 0) html += '<span style="color:var(--exp)">-' + fmt(dayExp) + '</span>';
        html += '</span></div>';

        html += '<div class="card" style="overflow:hidden">';

        for (var j = 0; j < groups[date].length; j++) {
            var bill = groups[date][j];
            var cat = getCat(bill.category);
            var acc = getAcc(bill.account);
            var sign = bill.type === 'income' ? '+' : '-';
            var clr = bill.type === 'income' ? 'var(--inc)' : 'var(--exp)';
            var noteEsc = (bill.note || '').replace(/"/g, '&quot;');

            html += '<div class="bil" onclick="showCtx(event,' + bill.id + ')">';
            html += '<div class="bico" style="background:' + cat.color + '22;color:' + cat.color + '"><i class="fa-solid ' + cat.icon + '"></i></div>';
            html += '<div style="flex:1;min-width:0">';
            html += '<div style="font-size:13px;font-weight:500">' + cat.name + '</div>';
            html += '<div style="font-size:10px;color:var(--mt);display:flex;gap:8px;margin-top:2px">';
            html += '<span><i class="fa-solid ' + acc.icon + '" style="margin-right:2px"></i>' + acc.name + '</span>';
            if (bill.note) {
                html += '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px" title="' + noteEsc + '">' + bill.note + '</span>';
            }
            html += '</div></div>';
            html += '<div style="font-size:15px;font-weight:600;color:' + clr + ';white-space:nowrap">' + sign + '¥' + fmt(bill.amount) + '</div>';
            html += '</div>';
        }

        html += '</div>';
    }

    el.innerHTML = html;
}

/* ===== 筛选切换 ===== */
function setFilter(t) {
    filterType = t;
    filterCat = 'all';
    var btns = document.querySelectorAll('[data-ft]');
    for (var i = 0; i < btns.length; i++) {
        if (btns[i].getAttribute('data-ft') === t) btns[i].classList.add('on');
        else btns[i].classList.remove('on');
    }
    renderCatFilter();
    renderList();
}

function onSearch() {
    searchNote = document.getElementById('searchInput').value;
    renderList();
}

/* ===== Tab 切换 ===== */
function switchTab(t) {
    var btns = document.querySelectorAll('.tb');
    for (var i = 0; i < btns.length; i++) {
        if (btns[i].getAttribute('data-tab') === t) btns[i].classList.add('on');
        else btns[i].classList.remove('on');
    }
    document.getElementById('listPage').style.display = t === 'list' ? 'block' : 'none';
    document.getElementById('statsPage').style.display = t === 'stats' ? 'block' : 'none';
    if (t === 'stats') renderStats();
}

function openAdd() {
    editId = null;
    document.getElementById('modalTitle').textContent = '记一笔';
    addType = 'expense';
    selCat = null;
    selAcc = 'cash';
    document.getElementById('amtInput').value = '';
    document.getElementById('dateInput').value = todayStr();
    document.getElementById('noteInput').value = '';
    updateModalType();
    renderCatGrid();
    renderAccGrid();
    document.getElementById('addModal').classList.add('on');
    setTimeout(function() { document.getElementById('amtInput').focus(); }, 400);
}

function closeAdd() {
    document.getElementById('addModal').classList.remove('on');
}

function setAddType(t) {
    addType = t;
    selCat = null;
    updateModalType();
    renderCatGrid();
}

function updateModalType() {
    var eb = document.getElementById('typeExp');
    var ib = document.getElementById('typeInc');
    eb.className = 'tswb' + (addType === 'expense' ? ' ea' : '');
    ib.className = 'tswb' + (addType === 'income' ? ' ia' : '');

function renderCatGrid() {
    var cats = CATS[addType];
    var h = '';
    for (var i = 0; i < cats.length; i++) {
        var c = cats[i];
        var sel = selCat === c.id ? ' sel' : '';
        h += '<div class="cati' + sel + '" onclick="pickCat(\'' + c.id + '\')">';
        h += '<div class="catic" style="background:' + c.color + '22;color:' + c.color + '">';
        h += '<i class="fa-solid ' + c.icon + '"></i></div>';
        h += '<span>' + c.name + '</span></div>';
    }
    document.getElementById('catGrid').innerHTML = h;
}

function pickCat(id) {
    selCat = id;
    renderCatGrid();
}

function renderAccGrid() {
    var h = '';
    for (var i = 0; i < ACCS.length; i++) {
        var a = ACCS[i];
        var sel = selAcc === a.id ? ' sel' : '';
        h += '<div class="acci' + sel + '" onclick="pickAcc(\'' + a.id + '\')">';
        h += '<i class="fa-solid ' + a.icon + '"></i>' + a.name + '</div>';
    }
    document.getElementById('accGrid').innerHTML = h;
}

function pickAcc(id) {
    selAcc = id;
    renderAccGrid();
}

/* ===== 保存账单 ===== */
function saveBill() {
    var amt = parseFloat(document.getElementById('amtInput').value);
    if (!amt || amt <= 0) { showToast('请输入有效金额'); return; }
    if (!selCat) { showToast('请选择分类'); return; }
    var date = document.getElementById('dateInput').value;
    if (!date) { showToast('请选择日期'); return; }
    var note = document.getElementById('noteInput').value.trim();

    if (editId) {
        /* 编辑已有账单 */
        for (var i = 0; i < bills.length; i++) {
            if (bills[i].id === editId) {
                bills[i].type = addType;
                bills[i].amount = amt;
                bills[i].category = selCat;
                bills[i].account = selAcc;
                bills[i].date = date;
                bills[i].note = note;
                break;
            }
        }
        showToast('已更新');
    } else {
        /* 新增账单 */
        bills.push({
            id: Date.now() + Math.floor(Math.random() * 1000),
            type: addType,
            amount: amt,
            category: selCat,
            account: selAcc,
            date: date,
            note: note
        });
        showToast('已保存');
    }

    persist();
    closeAdd();
    refresh();
}

/* ===== 操作菜单 ===== */
function showCtx(e, id) {
    e.stopPropagation();
    ctxTargetId = id;
    var menu = document.getElementById('ctxMenu');
    var x = e.clientX;
    var y = e.clientY;
    menu.style.left = Math.min(x, window.innerWidth - 130) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - 100) + 'px';
    menu.classList.add('show');
}

function hideCtx() {
    document.getElementById('ctxMenu').classList.remove('show');
    ctxTargetId = null;
}

document.addEventListener('click', function() { hideCtx(); });

function editBill() {
    if (ctxTargetId === null) return;
    var targetId = ctxTargetId;
    hideCtx();

    var bill = null;
    for (var i = 0; i < bills.length; i++) {
        if (bills[i].id === targetId) { bill = bills[i]; break; }
    }
    if (!bill) return;

    editId = bill.id;
    document.getElementById('modalTitle').textContent = '编辑账单';
    addType = bill.type;
    selCat = bill.category;
    selAcc = bill.account;
    document.getElementById('amtInput').value = bill.amount;
    document.getElementById('dateInput').value = bill.date;
    document.getElementById('noteInput').value = bill.note || '';
    updateModalType();
    renderCatGrid();
    renderAccGrid();
    document.getElementById('addModal').classList.add('on');
}

function deleteBill() {
    if (ctxTargetId === null) return;
    var targetId = ctxTargetId;
    hideCtx();

    var newBills = [];
    for (var i = 0; i < bills.length; i++) {
        if (bills[i].id !== targetId) newBills.push(bills[i]);
    }
    bills = newBills;
    persist();
    refresh();
    showToast('已删除');
}

/* ===== 统计图表 ===== */
function renderStats() {
    renderTrend();
    renderExpPie();
    renderIncPie();
    renderRank();
}

function getChartBaseOpts() {
    return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: {
                labels: { color: '#6B7A90', font: { size: 11, family: 'Noto Sans SC' } }
            }
        },
        scales: {
            x: { ticks: { color: '#6B7A90', font: { size: 10 } }, grid: { color: '#1E3050' } },
            y: { ticks: { color: '#6B7A90', font: { size: 10 } }, grid: { color: '#1E3050' } }
        }
    };
}

function getPieOpts() {
    return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: {
                position: 'right',
                labels: { color: '#6B7A90', font: { size: 10, family: 'Noto Sans SC' }, padding: 8, boxWidth: 12 }
            }
        }
    };
}

/* 收支趋势折线图 */
function renderTrend() {
    var mb = monthBills();
    var daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();
    var incData = [];
    var expData = [];
    var labels = [];
    for (var i = 0; i < daysInMonth; i++) {
        incData.push(0);
        expData.push(0);
        labels.push((i + 1) + '日');
    }
    for (var i = 0; i < mb.length; i++) {
        var dayIdx = parseInt(mb[i].date.split('-')[2]) - 1;
        if (dayIdx >= 0 && dayIdx < daysInMonth) {
            if (mb[i].type === 'income') incData[dayIdx] += mb[i].amount;
            else expData[dayIdx] += mb[i].amount;
        }
    }

    var ctx = document.getElementById('trendChart').getContext('2d');
    if (trendInst) trendInst.destroy();
    trendInst = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                { label: '收入', data: incData, borderColor: '#00E5A0', backgroundColor: 'rgba(0,229,160,.08)', fill: true, tension: 0.4, pointRadius: 1, borderWidth: 2 },
                { label: '支出', data: expData, borderColor: '#FF5C5C', backgroundColor: 'rgba(255,92,92,.08)', fill: true, tension: 0.4, pointRadius: 1, borderWidth: 2 }
            ]
        },
        options: getChartBaseOpts()
    });
}

/* 支出分类饼图 */
function renderExpPie() {
    var mb = monthBills().filter(function(b) { return b.type === 'expense'; });
    var catMap = {};
    for (var i = 0; i < mb.length; i++) {
        catMap[mb[i].category] = (catMap[mb[i].category] || 0) + mb[i].amount;
    }
    var entries = [];
    for (var k in catMap) {
        if (catMap.hasOwnProperty(k)) entries.push({ cat: getCat(k), val: catMap[k] });
    }
    entries.sort(function(a, b) { return b.val - a.val; });

    var ctx = document.getElementById('expPie').getContext('2d');
    if (expPieInst) expPieInst.destroy();
    if (!entries.length) { ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); return; }

    var labels = [];
    var data = [];
    var colors = [];
    for (var i = 0; i < entries.length; i++) {
        labels.push(entries[i].cat.name);
        data.push(entries[i].val);
        colors.push(entries[i].cat.color + 'CC');
    }

    expPieInst = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderColor: '#141E30', borderWidth: 2 }] },
        options: getPieOpts()
    });
}

/* 支出排行 */
function renderRank() {
    var mb = monthBills().filter(function(b) { return b.type === 'expense'; });
    var catMap = {};
    for (var i = 0; i < mb.length; i++) {
        catMap[mb[i].category] = (catMap[mb[i].category] || 0) + mb[i].amount;
    }
    var entries = [];
    for (var k in catMap) {
        if (catMap.hasOwnProperty(k)) entries.push({ cat: getCat(k), val: catMap[k] });
    }
    entries.sort(function(a, b) { return b.val - a.val; });

    var el = document.getElementById('rankList');
    if (!entries.length) {
        el.innerHTML = '<div style="text-align:center;color:var(--mt);padding:20px;font-size:12px">暂无支出数据</div>';
        return;
    }

    var maxVal = entries[0].val;
    var h = '';
    for (var i = 0; i < entries.length; i++) {
        var e = entries[i];
        var pct = Math.round(e.val / maxVal * 100);
        h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">';
        h += '<span style="font-size:11px;color:var(--mt);width:18px;text-align:right">' + (i + 1) + '</span>';
        h += '<div class="bico" style="background:' + e.cat.color + '22;color:' + e.cat.color + ';width:30px;height:30px;border-radius:8px;font-size:12px">';
        h += '<i class="fa-solid ' + e.cat.icon + '"></i></div>';
        h += '<div style="flex:1;min-width:0">';
        h += '<div style="display:flex;justify-content:space-between;margin-bottom:3px">';
        h += '<span style="font-size:12px">' + e.cat.name + '</span>';
        h += '<span style="font-size:12px;color:var(--exp)">¥' + fmt(e.val) + '</span></div>';
        h += '<div class="rkbar"><div class="rkbar-f" style="width:' + Math.max(pct, 8) + '%;background:' + e.cat.color + '">' + pct + '%</div></div>';
        h += '</div></div>';
    }
    el.innerHTML = h;
}

/* ===== Toast 提示 ===== */
function showToast(msg) {
    var el = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 2000);
}

/* ===== 全局刷新 ===== */
function refresh() {
    updateOverview();
    renderCatFilter();
    renderList();
    if (document.getElementById('statsPage').style.display !== 'none') {
        renderStats();
    }
}

/* ===== 键盘快捷键 ===== */
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeAdd();
        hideCtx();
    }
    if (e.key === 'Enter' && document.getElementById('addModal').classList.contains('on')) {
        saveBill();
    }
});

<!-- 替换自定义图标 -->
<link rel="icon" href="book-logo.ico" type="image/x-icon">
    
/* ===== 启动 ===== */
refresh();
</script>
</body>
</html>
