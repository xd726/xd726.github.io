<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端同步记账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 20px;
        }
        /* 登录弹窗样式 */
        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .auth-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border: none;
            background: #f0f0f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        .auth-tab.active {
            background: #4285f4;
            color: white;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn:hover {
            background: #3367d6;
        }
        .hide {
            display: none !important;
        }
        /* 提示框 */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            z-index: 1000;
            font-size: 14px;
        }
        /* 记账主界面 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }
        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #333;
        }
        .add-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .form-item {
            flex: 1;
            min-width: 140px;
        }
        .form-item select,
        .form-item input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        .bill-list {
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .bill-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bill-info {
            flex: 1;
        }
        .bill-category {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .bill-time {
            font-size: 12px;
            color: #999;
        }
        .bill-amount {
            font-size: 18px;
            font-weight: bold;
            margin: 0 15px;
        }
        .del-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>

    <!-- Firebase CDN SDK (兼容纯HTML，无需import) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- 登录/注册弹窗 -->
<div class="auth-modal" id="authModal">
    <div class="auth-box">
        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTab">登录</button>
            <button class="auth-tab" id="registerTab">注册</button>
        </div>

        <!-- 登录表单 -->
        <div id="loginForm">
            <div class="input-group">
                <label>邮箱</label>
                <input type="email" id="loginEmail" placeholder="请输入登录邮箱">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="loginPwd" placeholder="请输入密码">
            </div>
            <button class="btn" onclick="userLogin()">登录</button>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" class="hide">
            <div class="input-group">
                <label>邮箱</label>
                <input type="email" id="regEmail" placeholder="请输入注册邮箱">
            </div>
            <div class="input-group">
                <label>密码（至少6位）</label>
                <input type="password" id="regPwd" placeholder="请设置密码">
            </div>
            <button class="btn" onclick="userRegister()">注册</button>
        </div>
    </div>
</div>

<!-- 记账主界面 -->
<div class="container hide" id="mainContainer">
    <div class="title">📝 云端同步记账本</div>
    
    <div class="add-form">
        <div class="form-item">
            <select id="type">
                <option value="expense">💸 支出</option>
                <option value="income">💰 收入</option>
            </select>
        </div>
        <div class="form-item">
            <input type="number" id="amount" placeholder="金额" step="0.01">
        </div>
        <div class="form-item">
            <input type="text" id="category" placeholder="分类（餐饮/工资/交通）">
        </div>
        <div class="form-item">
            <input type="text" id="note" placeholder="备注（可选）">
        </div>
        <button class="btn" style="flex: none; padding: 0 25px;" onclick="saveBill()">保存账单</button>
    </div>

    <div class="bill-list" id="billList"></div>
</div>

<script>
// ====================== FIREBASE 配置（已填好你的信息）======================
const firebaseConfig = {
  apiKey: "AIzaSyBNm4QQI1-jQNCSyX6CRKYvmjTTL0tZuXw",
  authDomain: "my-ledger-5eff9.firebaseapp.com",
  projectId: "my-ledger-5eff9",
  storageBucket: "my-ledger-5eff9.firebasestorage.app",
  messagingSenderId: "880350136873",
  appId: "1:880350136873:web:aca976c1ec93011b582a38"
};

// 初始化 Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser = null;

// ====================== 登录/注册 切换 ======================
document.getElementById('loginTab').onclick = () => {
    document.getElementById('loginTab').classList.add('active');
    document.getElementById('registerTab').classList.remove('active');
    document.getElementById('loginForm').classList.remove('hide');
    document.getElementById('registerForm').classList.add('hide');
}
document.getElementById('registerTab').onclick = () => {
    document.getElementById('registerTab').classList.add('active');
    document.getElementById('loginTab').classList.remove('active');
    document.getElementById('registerForm').classList.remove('hide');
    document.getElementById('loginForm').classList.add('hide');
}

// ====================== 用户注册 ======================
async function userRegister() {
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPwd').value.trim();
    
    if (!email || password.length < 6) {
        showToast('密码长度至少6位！');
        return;
    }

    try {
        await auth.createUserWithEmailAndPassword(email, password);
        showToast('注册成功，自动登录！');
    } catch (e) {
        showToast('注册失败：' + e.message);
    }
}

// ====================== 用户登录 ======================
async function userLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPwd').value.trim();

    try {
        await auth.signInWithEmailAndPassword(email, password);
        showToast('登录成功！');
    } catch (e) {
        showToast('登录失败：' + e.message);
    }
}

// ====================== 监听登录状态 ======================
auth.onAuthStateChanged((user) => {
    if (user) {
        currentUser = user;
        // 登录成功：隐藏弹窗，显示主界面
        document.getElementById('authModal').classList.add('hide');
        document.getElementById('mainContainer').classList.remove('hide');
        // 加载云端账单
        getBills();
    } else {
        currentUser = null;
        // 未登录：显示弹窗，隐藏主界面
        document.getElementById('authModal').classList.remove('hide');
        document.getElementById('mainContainer').classList.add('hide');
    }
});

// ====================== 保存账单到云端 ======================
async function saveBill() {
    const type = document.getElementById('type').value;
    const amount = document.getElementById('amount').value.trim();
    const category = document.getElementById('category').value.trim();
    const note = document.getElementById('note').value.trim();

    if (!amount || !category) {
        showToast('请填写金额和分类！');
        return;
    }

    try {
        await db.collection('bills').add({
            uid: currentUser.uid,
            type: type,
            amount: amount,
            category: category,
            note: note,
            createTime: new Date().toLocaleString()
        });

        // 清空输入框
        document.getElementById('amount').value = '';
        document.getElementById('category').value = '';
        document.getElementById('note').value = '';
        
        showToast('账单保存成功！');
        getBills(); // 刷新列表
    } catch (e) {
        showToast('保存失败：' + e.message);
    }
}

// ====================== 获取云端账单 ======================
async function getBills() {
    const snapshot = await db.collection('bills')
        .where('uid', '==', currentUser.uid)
        .orderBy('createTime', 'desc')
        .get();

    const billList = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
    }));

    renderBillList(billList);
}

// ====================== 渲染账单列表 ======================
function renderBillList(list) {
    const container = document.getElementById('billList');
    let html = '';

    list.forEach(item => {
        const isExpense = item.type === 'expense';
        html += `
        <div class="bill-item">
            <div class="bill-info">
                <div class="bill-category">${item.category}</div>
                <div class="bill-time">${item.note || '无备注'} · ${item.createTime}</div>
            </div>
            <div class="bill-amount" style="color:${isExpense ? '#ff4757' : '#2ed573'}">
                ${isExpense ? '-' : '+'}¥${item.amount}
            </div>
            <button class="del-btn" onclick="deleteBill('${item.id}')">删除</button>
        </div>
        `;
    });

    container.innerHTML = list.length === 0 ? '<div style="text-align:center;padding:30px;color:#999">暂无账单记录</div>' : html;
}

// ====================== 删除账单 ======================
async function deleteBill(billId) {
    if (!confirm('确定删除这条账单吗？')) return;
    
    try {
        await db.collection('bills').doc(billId).delete();
        showToast('删除成功！');
        getBills();
    } catch (e) {
        showToast('删除失败：' + e.message);
    }
}

// ====================== 提示框 ======================
function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.remove();
    }, 2000);
}
</script>
</body>
</html>
