<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活记账</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0C1220;--bg2:#111827;--card:#141E30;--cardh:#1A2740;--bdr:#1E3050;--fg:#E8ECF1;--mt:#6B7A90;--ac:#00E5A0;--acd:rgba(0,229,160,.12);--inc:#00E5A0;--exp:#FF5C5C;--wrn:#FFB830}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
.glow{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0}
.g1{width:420px;height:420px;background:var(--ac);top:-120px;right:-100px;opacity:.1;animation:gp 10s ease-in-out infinite}
.g2{width:320px;height:320px;background:var(--exp);bottom:-80px;left:-60px;opacity:.07;animation:gp 12s ease-in-out infinite 2s}
@keyframes gp{0%,100%{opacity:.08;transform:scale(1)}50%{opacity:.16;transform:scale(1.08)}}
.wrap{max-width:520px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
@media(min-width:960px){.wrap{max-width:920px}.d2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fw{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;transition:border-color .3s}.card:hover{border-color:rgba(0,229,160,.18)}
.ov{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--bdr);position:relative;overflow:hidden}
.ov::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
.ov.ic::before{background:var(--inc)}.ov.ec::before{background:var(--exp)}.ov.bc::before{background:var(--wrn)}
.tb{padding:9px 20px;border-radius:10px;font-weight:500;transition:all .3s;cursor:pointer;color:var(--mt);background:none;border:none;font-size:13px;font-family:inherit}
.tb.on{background:var(--acd);color:var(--ac)}.tb:hover:not(.on){color:var(--fg)}
.ft{padding:5px 12px;border-radius:18px;font-size:11px;border:1px solid var(--bdr);background:none;color:var(--mt);cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.ft.on{background:var(--acd);border-color:var(--ac);color:var(--ac)}.ft:hover:not(.on){border-color:var(--mt);color:var(--fg)}
.btn1{width:100%;padding:13px;border-radius:14px;border:none;background:var(--ac);color:#0C1220;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn1:hover{opacity:.9;transform:translateY(-1px)}.btn1:active{transform:translateY(0)}
.btn2{padding:9px 18px;border-radius:10px;border:1px solid var(--bdr);background:var(--card);color:var(--fg);font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn2:hover{border-color:var(--ac);color:var(--ac)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:14px;border:2px dashed var(--ac);background:var(--acd);color:var(--ac);font-weight:700;font-size:15px;cursor:pointer;transition:all .25s;font-family:inherit;animation:ap 3s ease-in-out infinite}
.add-btn:hover{background:rgba(0,229,160,.2);border-style:solid;transform:translateY(-1px)}
@keyframes ap{0%,100%{box-shadow:0 0 0 0 rgba(0,229,160,.15)}50%{box-shadow:0 0 0 8px rgba(0,229,160,0)}}
.mnbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--bdr);background:var(--card);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:12px}
.mnbtn:hover{border-color:var(--ac);color:var(--ac)}
.inp{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--bdr);background:var(--bg2);color:var(--fg);font-size:13px;outline:none;transition:border-color .2s;font-family:inherit}
.inp:focus{border-color:var(--ac)}.inp::placeholder{color:var(--mt)}
.aminp{width:100%;background:none;border:none;color:var(--fg);font-size:32px;font-weight:700;outline:none;text-align:center;font-family:inherit}
.aminp::placeholder{color:var(--bdr)}
.tsw{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.tswb{flex:1;padding:9px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .3s;font-family:inherit;background:none;color:var(--mt)}
.tswb.ea{background:rgba(255,92,92,.12);color:var(--exp)}.tswb.ia{background:rgba(0,229,160,.12);color:var(--inc)}
.cati{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:10px;cursor:pointer;transition:all .2s;border:2px solid transparent;background:none}
.cati:hover{background:var(--cardh)}.cati.sel{border-color:var(--ac);background:var(--acd)}
.cati span{font-size:10px;color:var(--mt);margin-top:3px}.cati.sel span{color:var(--ac)}
.catic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px}
.acci{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;cursor:pointer;transition:all .2s;border:1px solid var(--bdr);background:none;color:var(--mt);font-size:11px;font-family:inherit}
.acci.sel{border-color:var(--ac);background:var(--acd);color:var(--ac)}.acci:hover:not(.sel){border-color:var(--mt)}
.bil{display:flex;align-items:center;padding:11px 12px;border-radius:11px;transition:all .15s;cursor:pointer;gap:10px}
.bil:hover{background:var(--cardh)}
.bico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.mo.on{opacity:1;pointer-events:all}
.moc{background:var(--card);border:1px solid var(--bdr);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);padding:20px}
.mo.on .moc{transform:translateY(0)}
@media(min-width:640px){.mo{align-items:center}.moc{border-radius:20px;max-height:82vh;transform:translateY(30px) scale(.96)}.mo.on .moc{transform:translateY(0) scale(1)}}
.bubar{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}.bubar-f{height:100%;border-radius:3px;transition:width .5s ease}
.rkbar{height:20px;background:var(--bg2);border-radius:5px;overflow:hidden}
.rkbar-f{height:100%;border-radius:5px;transition:width .5s;display:flex;align-items:center;padding-left:7px;font-size:10px;font-weight:600;color:var(--bg);min-width:fit-content}
.tst{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);padding:10px 20px;border-radius:12px;background:var(--card);border:1px solid var(--bdr);color:var(--fg);font-size:13px;z-index:300;transition:transform .4s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:7px}
.tst.show{transform:translateX(-50%) translateY(0)}
.ctx{position:fixed;background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:4px;min-width:110px;z-index:150;display:none;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.ctx.show{display:block}
.ctx button{display:flex;align-items:center;gap:7px;width:100%;padding:7px 11px;border:none;background:none;color:var(--fg);font-size:12px;cursor:pointer;border-radius:6px;font-family:inherit;transition:background .15s}
.ctx button:hover{background:var(--cardh)}.ctx button.dg{color:var(--exp)}
.dgh{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;font-size:11px;color:var(--mt)}
.cscr{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}.cscr::-webkit-scrollbar{display:none}
.sw{position:relative}.sw>i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mt);font-size:12px}.sw input{padding-left:32px}
/* 登录页 */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.auth-card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:32px 24px;width:100%;max-width:400px}
.auth-tab{display:flex;gap:4px;margin-bottom:24px;background:var(--bg2);border-radius:10px;padding:3px}
.auth-tab button{flex:1;padding:9px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:all .3s;background:none;color:var(--mt)}
.auth-tab button.on{background:var(--acd);color:var(--ac)}
.auth-err{font-size:12px;color:var(--exp);margin-top:8px;min-height:18px}
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(0,229,160,.1);color:var(--ac)}
.sync-badge.off{background:rgba(255,92,92,.1);color:var(--exp)}
</style>
</head>
<body>

<div class="glow g1"></div>
<div class="glow g2"></div>

<!-- ==================== 登录页 ==================== -->
<div id="authPage" class="auth-wrap">
    <div class="auth-card">
        <div style="text-align:center;margin-bottom:24px">
            <div style="font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:4px">
                <i class="fa-solid fa-book-open" style="color:var(--ac);margin-right:6px"></i>生活记账
            </div>
            <p style="font-size:12px;color:var(--mt)">登录后数据云端同步，多设备共享</p>
        </div>
        <div class="auth-tab">
            <button class="on" id="loginTab" onclick="switchAuthTab('login')">登录</button>
            <button id="regTab" onclick="switchAuthTab('register')">注册</button>
        </div>
        <div style="margin-bottom:14px">
            <input type="email" id="authEmail" class="inp" placeholder="邮箱地址" style="padding:12px 14px">
        </div>
        <div style="margin-bottom:6px">
            <input type="password" id="authPass" class="inp" placeholder="密码（至少6位）" style="padding:12px 14px">
        </div>
        <div class="auth-err" id="authErr"></div>
        <button class="btn1" id="authBtn" onclick="handleAuth()" style="margin-top:12px">
            <i class="fa-solid fa-right-to-bracket" style="margin-right:6px"></i>登录
        </button>
        <div style="text-align:center;margin-top:16px">
            <button style="background:none;border:none;color:var(--mt);font-size:12px;cursor:pointer;font-family:inherit" onclick="handleGuest()">
                <i class="fa-solid fa-user-secret" style="margin-right:4px"></i>暂不登录，先看看
            </button>
        </div>
    </div>
</div>

<!-- ==================== 主应用 ==================== -->
<div id="appPage" style="display:none">
<div class="wrap" style="padding-top:20px;padding-bottom:40px">

    <!-- 顶部 -->
    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <div>
            <h1 style="font-size:21px;font-weight:900;letter-spacing:-.5px">生活记账</h1>
            <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
                <span id="userEmail" style="font-size:11px;color:var(--mt)"></span>
                <span class="sync-badge" id="syncBadge"><i class="fa-solid fa-cloud"></i>已同步</span>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
            <button class="mnbtn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="monthDisp" style="font-size:13px;font-weight:600;min-width:86px;text-align:center;cursor:pointer" onclick="goToday()" title="回到本月"></span>
            <button class="mnbtn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
            <button class="mnbtn" onclick="handleLogout()" title="退出登录"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <!-- 概览 -->
    <section style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        <div class="ov ic"><div style="font-size:10px;color:var(--mt);margin-bottom:4px"><i class="fa-solid fa-arrow-down" style="color:var(--inc);margin-right:3px"></i>收入</div><div id="totInc" style="font-size:16px;font-weight:700;color:var(--inc)">0.00</div></div>
        <div class="ov ec"><div style="font-size:10px;color:var(--mt);margin-bottom:4px"><i class="fa-solid fa-arrow-up" style="color:var(--exp);margin-right:3px"></i>支出</div><div id="totExp" style="font-size:16px;font-weight:700;color:var(--exp)">0.00</div></div>
        <div class="ov bc"><div style="font-size:10px;color:var(--mt);margin-bottom:4px"><i class="fa-solid fa-wallet" style="color:var(--wrn);margin-right:3px"></i>结余</div><div id="totBal" style="font-size:16px;font-weight:700;color:var(--wrn)">0.00</div></div>
    </section>

    <!-- 月预算 -->
    <section class="card" style="padding:14px;margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:12px;color:var(--mt)"><i class="fa-solid fa-bullseye" style="margin-right:4px"></i>月预算</span>
            <div style="display:flex;align-items:center;gap:4px"><span style="font-size:11px;color:var(--mt)">¥</span><input type="number" id="budgetInp" class="inp" style="width:90px;padding:5px 8px;font-size:12px;text-align:right" placeholder="设置预算" onchange="saveBudget()"></div>
        </div>
        <div class="bubar"><div id="budgetBar" class="bubar-f" style="width:0%;background:var(--ac)"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:5px">
            <span id="budgetSpent" style="font-size:10px;color:var(--mt)">已花 ¥0</span>
            <span id="budgetRemain" style="font-size:10px;color:var(--mt)">剩余 ¥0</span>
        </div>
    </section>

    <!-- 记一笔 大按钮 -->
    <button class="add-btn" onclick="openAdd()" style="margin-bottom:14px">
        <i class="fa-solid fa-plus"></i> 记一笔
    </button>

    <!-- Tab -->
    <nav style="display:flex;gap:3px;margin-bottom:16px;background:var(--bg2);border-radius:11px;padding:3px">
        <button class="tb on" data-tab="list" onclick="switchTab('list')"><i class="fa-solid fa-list" style="margin-right:5px"></i>明细</button>
        <button class="tb" data-tab="stats" onclick="switchTab('stats')"><i class="fa-solid fa-chart-pie" style="margin-right:5px"></i>统计</button>
    </nav>

    <!-- 明细 -->
    <section id="listPage">
        <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
            <button class="ft on" data-ft="all" onclick="setFilter('all')">全部</button>
            <button class="ft" data-ft="expense" onclick="setFilter('expense')">支出</button>
            <button class="ft" data-ft="income" onclick="setFilter('income')">收入</button>
            <div class="sw" style="flex:1;min-width:130px"><i class="fa-solid fa-search"></i><input class="inp" id="searchInput" style="font-size:12px;padding:7px 10px 7px 30px" placeholder="搜索备注..." oninput="onSearch()"></div>
        </div>
        <div id="catFilter" class="cscr" style="margin-bottom:12px"></div>
        <div id="billList"></div>
    </section>

    <!-- 统计 -->
    <section id="statsPage" style="display:none">
        <div class="d2">
            <div class="card fw" style="padding:16px;margin-bottom:14px">
                <h3 style="font-size:14px;font-weight:600;margin-bottom:8px"><i class="fa-solid fa-chart-line" style="color:var(--ac);margin-right:6px"></i>收支趋势</h3>
                <div class="chbox" style="height:240px;padding:6px"><canvas id="trendChart"></canvas></div>
            </div>
            <div class="card" style="padding:16px;margin-bottom:14px">
                <h3 style="font-size:14px;font-weight:600;margin-bottom:8px"><i class="fa-solid fa-chart-pie" style="color:var(--exp);margin-right:6px"></i>支出分类</h3>
                <div class="chbox" style="height:240px;padding:6px"><canvas id="expPie"></canvas></div>
            </div>
            <div class="card" style="padding:16px;margin-bottom:14px">
                <h3 style="font-size:14px;font-weight:600;margin-bottom:8px"><i class="fa-solid fa-chart-pie" style="color:var(--inc);margin-right:6px"></i>收入分类</h3>
                <div class="chbox" style="height:240px;padding:6px"><canvas id="incPie"></canvas></div>
            </div>
            <div class="card fw" style="padding:16px;margin-bottom:14px">
                <h3 style="font-size:14px;font-weight:600;margin-bottom:12px"><i class="fa-solid fa-ranking-star" style="color:var(--wrn);margin-right:6px"></i>支出排行</h3>
                <div id="rankList"></div>
            </div>
        </div>
    </section>
</div>
</div>

<!-- 添加/编辑模态框 -->
<div class="mo" id="addModal" onclick="if(event.target===this)closeAdd()">
    <div class="moc">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <h2 id="modalTitle" style="font-size:17px;font-weight:700">记一笔</h2>
            <button style="background:none;border:none;color:var(--mt);font-size:18px;cursor:pointer;padding:4px" onclick="closeAdd()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="tsw" style="margin-bottom:16px">
            <button class="tswb ea" id="typeExp" onclick="setAddType('expense')">支出</button>
            <button class="tswb" id="typeInc" onclick="setAddType('income')">收入</button>
        </div>
        <div style="text-align:center;margin-bottom:16px;padding:10px 0;border-bottom:1px solid var(--bdr)">
            <span style="font-size:20px;font-weight:300;color:var(--mt)">¥</span>
            <input type="number" id="amtInput" class="aminp" placeholder="0.00" step="0.01" min="0">
        </div>
        <div style="margin-bottom:14px">
            <div style="font-size:12px;color:var(--mt);margin-bottom:8px">分类</div>
            <div id="catGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px"></div>
        </div>
        <div style="margin-bottom:14px">
            <div style="font-size:12px;color:var(--mt);margin-bottom:8px">账户</div>
            <div id="accGrid" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        </div>
        <div style="margin-bottom:14px">
            <div style="font-size:12px;color:var(--mt);margin-bottom:6px">日期</div>
            <input type="date" id="dateInput" class="inp">
        </div>
        <div style="margin-bottom:18px">
            <div style="font-size:12px;color:var(--mt);margin-bottom:6px">备注</div>
            <input type="text" id="noteInput" class="inp" placeholder="添加备注..." maxlength="50">
        </div>
        <button class="btn1" onclick="saveBill()">保存</button>
    </div>
</div>

<!-- 操作菜单 -->
<div class="ctx" id="ctxMenu">
    <button onclick="editBill()"><i class="fa-solid fa-pen"></i> 编辑</button>
    <button class="dg" onclick="deleteBill()"><i class="fa-solid fa-trash"></i> 删除</button>
</div>

<!-- Toast -->
<div class="tst" id="toast"><i class="fa-solid fa-check-circle" style="color:var(--ac)"></i><span id="toastMsg"></span></div>

<script>
/* ================================================================
   🔥 Firebase 配置 — 替换成你自己的项目信息！
   获取方式见下方教程
   ================================================================ */
var firebaseConfig = {
    apiKey: "AIzaSyDQKICU7UTQ6a8ziODV5TvHNc4xMiyWoTg",
    authDomain: "jizhang-3ebd9.firebaseapp.com",
    projectId: "jizhang-3ebd9",
    storageBucket: "jizhang-3ebd9.firebasestorage.app",
    messagingSenderId: "251885966028",
    appId: "1:251885966028:web:a1ab6d5358d3260272a869"
};

/* ===== 初始化 Firebase ===== */
var fbApp = null, fbAuth = null, fbDb = null;
var firebaseReady = false;

try {
    fbApp = firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    firebaseReady = true;
} catch(e) {
    console.warn('Firebase 初始化失败，将使用本地存储模式', e);
}

/* ===== 分类数据 ===== */
var CATS = {
    expense:[
        {id:'food',name:'餐饮',icon:'fa-utensils',color:'#FF6B6B'},
        {id:'transport',name:'交通',icon:'fa-bus',color:'#4ECDC4'},
        {id:'shopping',name:'购物',icon:'fa-bag-shopping',color:'#FFD93D'},
        {id:'housing',name:'住房',icon:'fa-house',color:'#A78BFA'},
        {id:'fun',name:'娱乐',icon:'fa-gamepad',color:'#F472B6'},
        {id:'medical',name:'医疗',icon:'fa-hospital',color:'#34D399'},
        {id:'edu',name:'教育',icon:'fa-graduation-cap',color:'#60A5FA'},

/* 从云端加载数据 */
function loadFromCloud(){
    if(!firebaseReady||!fbDb||!currentUid||isGuest)return;
    syncing=true;
    setSyncStatus(false);

    fbDb.collection('users').doc(currentUid).collection('bills').orderBy('date','desc').get().then(function(snap){
        bills=[];
        snap.forEach(function(doc){
            var d=doc.data();
            d._docId=doc.id; // 保存文档ID，用于更新/删除
            bills.push(d);
        });
        /* 同时缓存到本地 */
        persistLocal();
        syncing=false;
        setSyncStatus(true);
        showApp();
    }).catch(function(err){
        console.warn('云端加载失败，尝试本地缓存',err);
        syncing=false;
        setSyncStatus(false);
        /* 降级到本地 */
        try{var saved=localStorage.getItem(localKey());if(saved)bills=JSON.parse(saved);}catch(e){}
        if(!bills.length)generateSampleData();
        showApp();
    });
}

/* 保存单条到云端 */
function saveToCloud(bill, docId){
    if(!firebaseReady||!fbDb||!currentUid||isGuest)return;
    setSyncStatus(false);
    var coll=fbDb.collection('users').doc(currentUid).collection('bills');

    if(docId){
        /* 更新 */
        var data=Object.assign({},bill);delete data._docId;
        coll.doc(docId).update(data).then(function(){setSyncStatus(true);}).catch(function(e){console.warn('更新失败',e);setSyncStatus(false);});
    }else{
        /* 新增 */
        var data=Object.assign({},bill);delete data._docId;
        coll.add(data).then(function(ref){
            /* 回写文档ID */
            for(var i=0;i<bills.length;i++){
                if(bills[i].id===bill.id){bills[i]._docId=ref.id;break;}
            }
            persistLocal();
            setSyncStatus(true);
        }).catch(function(e){console.warn('新增失败',e);setSyncStatus(false);});
    }
}

/* 从云端删除 */
function deleteFromCloud(docId){
    if(!firebaseReady||!fbDb||!currentUid||isGuest||!docId)return;
    setSyncStatus(false);
    fbDb.collection('users').doc(currentUid).collection('bills').doc(docId).delete().then(function(){setSyncStatus(true);}).catch(function(e){console.warn('删除失败',e);setSyncStatus(false);});
}

/* ===== 数据筛选 ===== */
function monthBills(){var k=monthKey(curYear,curMonth);return bills.filter(function(b){return b.date.substring(0,7)===k;});}
function filteredBills(){
    var l=monthBills();
    if(filterType!=='all')l=l.filter(function(b){return b.type===filterType;});
    if(filterCat!=='all')l=l.filter(function(b){return b.category===filterCat;});
    if(searchNote.trim()){var q=searchNote.trim();l=l.filter(function(b){return(b.note||'').indexOf(q)!==-1;});}
    return l.sort(function(a,b){if(b.date!==a.date)return b.date.localeCompare(a.date);return b.id-a.id;});
}

function updateOverview(){
    var mb=monthBills(),inc=0,exp=0;
    for(var i=0;i<mb.length;i++){if(mb[i].type==='income')inc+=mb[i].amount;else exp+=mb[i].amount;}
    document.getElementById('totInc').textContent=fmt(inc);

    var budget=parseFloat(localStorage.getItem(budgetLocalKey())||'0');

    bar.style.background=pct>90?'var(--exp)':pct>60?'var(--wrn)':'var(--ac)';
    document.getElementById('budgetSpent').textContent='已花 ¥'+fmt(exp);
    document.getElementById('budgetRemain').textContent=budget>0?'剩余 ¥'+fmt(Math.max(0,budget-exp)):'未设预算';

/* ===== 账单列表 ===== */
function renderList(){
    var list=filteredBills(),el=document.getElementById('billList');
    if(!list.length){el.innerHTML='<div style="text-align:center;padding:50px 20px;color:var(--mt)"><i class="fa-solid fa-receipt" style="font-size:42px;margin-bottom:12px;opacity:.2;display:block"></i><p>暂无账单记录</p><p style="font-size:11px;margin-top:4px">点击上方按钮开始记账</p></div>';return;}
    var groups={};
    for(var i=0;i<list.length;i++){var b=list[i];if(!groups[b.date])groups[b.date]=[];groups[b.date].push(b);}
    var wk=['日','一','二','三','四','五','六'],html='';
    var dates=Object.keys(groups).sort(function(a,b){return b.localeCompare(a);});
    for(var d=0;d<dates.length;d++){
        var date=dates[d],parts=date.split('-'),dayInc=0,dayExp=0;
        for(var j=0;j<groups[date].length;j++){if(groups[date][j].type==='income')dayInc+=groups[date][j].amount;else dayExp+=groups[date][j].amount;}
        var dateObj=new Date(date+'T00:00:00');
        html+='<div class="dgh" style="margin-top:10px"><span>'+parseInt(parts[1])+'月'+parseInt(parts[2])+'日 周'+wk[dateObj.getDay()]+'</span><span>';
        if(dayInc>0)html+='<span style="color:var(--inc)">+'+fmt(dayInc)+'</span> ';
        if(dayExp>0)html+='<span style="color:var(--exp)">-'+fmt(dayExp)+'</span>';
        html+='</span></div><div class="card" style="overflow:hidden">';
        for(var j=0;j<groups[date].length;j++){
            var bill=groups[date][j],cat=getCat(bill.category),acc=getAcc(bill.account);
            var sign=bill.type==='income'?'+':'-',clr=bill.type==='income'?'var(--inc)':'var(--exp)';
            var noteEsc=(bill.note||'').replace(/"/g,'&quot;');
            html+='<div class="bil" onclick="showCtx(event,'+bill.id+',\''+(bill._docId||'')+'\')">';
            html+='<div class="bico" style="background:'+cat.color+'22;color:'+cat.color+'"><i class="fa-solid '+cat.icon+'"></i></div>';
            html+='<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500">'+cat.name+'</div>';
            html+='<div style="font-size:10px;color:var(--mt);display:flex;gap:8px;margin-top:2px">';
            html+='<span><i class="fa-solid '+acc.icon+'" style="margin-right:2px"></i>'+acc.name+'</span>';
            if(bill.note)html+='<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px" title="'+noteEsc+'">'+bill.note+'</span>';
            html+='</div></div>';
            html+='<div style="font-size:15px;font-weight:600;color:'+clr+';white-space:nowrap">'+sign+'¥'+fmt(bill.amount)+'</div></div>';
        }
        html+='</div>';
    }
    el.innerHTML=html;
}

function saveBill(){
    var amt=parseFloat(document.getElementById('amtInput').value);
    if(!amt||amt<=0){showToast('请输入有效金额');return;}
    if(!selCat){showToast('请选择分类');return;}
    var date=document.getElementById('dateInput').value;
    if(!date){showToast('请选择日期');return;}
    var note=document.getElementById('noteInput').value.trim();

    if(editId){
        for(var i=0;i<bills.length;i++){
            if(bills[i].id===editId){
                bills[i].type=addType;bills[i].amount=amt;bills[i].category=selCat;
                bills[i].account=selAcc;bills[i].date=date;bills[i].note=note;
                saveToCloud(bills[i],editDocId);
                break;
            }
        }
        showToast('已更新');
    }else{
        var bill={id:Date.now()+Math.floor(Math.random()*1000),type:addType,amount:amt,category:selCat,account:selAcc,date:date,note:note,_docId:null};
        bills.push(bill);
        saveToCloud(bill,null);
        showToast('已保存');
    }
    persistLocal();closeAdd();refresh();
}

function editBill(){
    if(ctxTargetId===null)return;
    var tid=ctxTargetId,tdoc=ctxTargetDocId;hideCtx();
    var bill=null;for(var i=0;i<bills.length;i++){if(bills[i].id===tid){bill=bills[i];break;}}
    if(!bill)return;
    editId=bill.id;editDocId=tdoc;
    document.getElementById('modalTitle').textContent='编辑账单';
    addType=bill.type;selCat=bill.category;selAcc=bill.account;
    document.getElementById('amtInput').value=bill.amount;

    document.getElementById('noteInput').value=bill.note||'';

function deleteBill(){
    if(ctxTargetId===null)return;
    var tid=ctxTargetId,tdoc=ctxTargetDocId;hideCtx();
    var newBills=[];for(var i=0;i<bills.length;i++){if(bills[i].id!==tid)newBills.push(bills[i]);}

    deleteFromCloud(tdoc);
    persistLocal();refresh();showToast('已删除');
}

    var incD=[],expD=[],labels=[];
    for(var i=0;i<dim;i++){incD.push(0);expD.push(0);labels.push((i+1)+'日');}
    for(var i=0;i<mb.length;i++){var d=parseInt(mb[i].date.split('-')[2])-1;if(d>=0&&d<dim){if(mb[i].type==='income')incD[d]+=mb[i].amount;else expD[d]+=mb[i].amount;}}
    var ctx=document.getElementById('trendChart').getContext('2d');
    if(trendInst)trendInst.destroy();
    trendInst=new Chart(ctx,{type:'line',data:{labels:labels,datasets:[{label:'收入',data:incD,borderColor:'#00E5A0',backgroundColor:'rgba(0,229,160,.08)',fill:true,tension:.4,pointRadius:1,borderWidth:2},{label:'支出',data:expD,borderColor:'#FF5C5C',backgroundColor:'rgba(255,92,92,.08)',fill:true,tension:.4,pointRadius:1,borderWidth:2}]},options:getChartBase()});
}

function renderExpPie(){
    var mb=monthBills().filter(function(b){return b.type==='expense';}),cm={};
    for(var i=0;i<mb.length;i++)cm[mb[i].category]=(cm[mb[i].category]||0)+mb[i].amount;
    var en=[];for(var k in cm)if(cm.hasOwnProperty(k))en.push({cat:getCat(k),val:cm[k]});
    en.sort(function(a,b){return b.val-a.val;});
    var ctx=document.getElementById('expPie').getContext('2d');if(expPieInst)expPieInst.destroy();
    if(!en.length){ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);return;}
    var lb=[],dt=[],cl=[];for(var i=0;i<en.length;i++){lb.push(en[i].cat.name);dt.push(en[i].val);cl.push(en[i].cat.color+'CC');}
    expPieInst=new Chart(ctx,{type:'doughnut',data:{labels:lb,datasets:[{data:dt,backgroundColor:cl,borderColor:'#141E30',borderWidth:2}]},options:getPieOpts()});
}

function renderRank(){
    var mb=monthBills().filter(function(b){return b.type==='expense';}),cm={};
    for(var i=0;i<mb.length;i++)cm[mb[i].category]=(cm[mb[i].category]||0)+mb[i].amount;
    var en=[];for(var k in cm)if(cm.hasOwnProperty(k))en.push({cat:getCat(k),val:cm[k]});
    en.sort(function(a,b){return b.val-a.val;});
    var el=document.getElementById('rankList');
    if(!en.length){el.innerHTML='<div style="text-align:center;color:var(--mt);padding:20px;font-size:12px">暂无支出数据</div>';return;}
    var mx=en[0].val,h='';
    for(var i=0;i<en.length;i++){var e=en[i],pct=Math.round(e.val/mx*100);
        h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">';
        h+='<span style="font-size:11px;color:var(--mt);width:18px;text-align:right">'+(i+1)+'</span>';
        h+='<div class="bico" style="background:'+e.cat.color+'22;color:'+e.cat.color+';width:30px;height:30px;border-radius:8px;font-size:12px"><i class="fa-solid '+e.cat.icon+'"></i></div>';
        h+='<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px">'+e.cat.name+'</span><span style="font-size:12px;color:var(--exp)">¥'+fmt(e.val)+'</span></div>';
        h+='<div class="rkbar"><div class="rkbar-f" style="width:'+Math.max(pct,8)+'%;background:'+e.cat.color+'">'+pct+'%</div></div>';
        h+='</div></div>';
    }
    el.innerHTML=h;
}

/* ===== Toast ===== */
function showToast(msg){var el=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2000);}

/* ===== 全局刷新 ===== */
function refresh(){updateOverview();renderCatFilter();renderList();if(document.getElementById('statsPage').style.display!=='none')renderStats();}

/* ===== 键盘快捷键 ===== */
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeAdd();hideCtx();}if(e.key==='Enter'&&document.getElementById('addModal').classList.contains('on')){saveBill();}});

/* ===== 启动：检查是否已登录 ===== */
if(firebaseReady&&fbAuth){
    /* Firebase 会自动恢复登录状态，等 onAuthStateChanged 触发 */
    /* 给 2 秒等待，超时则显示登录页 */
    var authTimeout=setTimeout(function(){
        if(!currentUid){
            document.getElementById('authPage').style.display='flex';
        }
    },2000);
    /* 如果 onAuthStateChanged 没有触发（配置错误等），也显示登录页 */
}else{
    /* Firebase 不可用，直接显示登录页 */
    document.getElementById('authPage').style.display='flex';
}
